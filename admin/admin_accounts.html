<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>admins accounts</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="../css/admin_style.css">

   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="admin-header"></div>

<!-- admins accounts section starts  -->

<section class="accounts">

   <h1 class="heading">admins account</h1>

   <div class="box-container" id="accounts-container">
      <div class="box">
         <p>register new admin</p>
         <a href="register_admin.html" class="option-btn">register</a>
      </div>
      <!-- Admin accounts will be loaded here -->
   </div>

</section>

<!-- admins accounts section ends -->

<!-- custom js file link  -->
<script src="../js/admin_script.js"></script>
<script>
$(document).ready(function() {
    // Load admin header
    $("#admin-header").load("../components/admin_header.html");

    // Function to load admin accounts
    function loadAccounts() {
        $.ajax({
            url: 'admin_accounts_handler.php',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                var container = $('#accounts-container');
                container.find('.box:not(:first)').remove();
                if(data.accounts.length > 0) {
                    $.each(data.accounts, function(i, account) {
                        container.append(`
                            <div class="box">
                                <p> admin id : <span>${account.id}</span> </p>
                                <p> username : <span>${account.name}</span> </p>
                                <div class="flex-btn">
                                    <a href="#" class="delete-btn" data-id="${account.id}">delete</a>
                                    ${account.id == data.current_admin_id ? '<a href="update_profile.html" class="option-btn">update</a>' : ''}
                                </div>
                            </div>
                        `);
                    });
                } else {
                    container.append('<p class="empty">no accounts available</p>');
                }
            },
            error: function() {
                alert('Failed to load admin accounts');
            }
        });
    }

    // Load accounts on page load
    loadAccounts();

    // Handle delete button click
    $(document).on('click', '.delete-btn', function(e) {
        e.preventDefault();
        if(confirm('delete this account?')) {
            var adminId = $(this).data('id');
            $.ajax({
                url: 'admin_accounts_handler.php',
                type: 'GET',
                data: {delete: adminId},
                dataType: 'json',
                success: function(response) {
                    if(response.success) {
                        loadAccounts();
                    } else {
                        alert('Failed to delete admin');
                    }
                },
                error: function() {
                    alert('Failed to delete admin');
                }
            });
        }
    });
});
</script>

</body>
</html>

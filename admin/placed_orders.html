<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placed Orders</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="../css/admin_style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="admin-header"></div>

<section class="placed-orders">
    <h1 class="heading">Placed Orders</h1>
    <div class="box-container" id="orders-container"></div>
</section>

<script>
$(document).ready(function() {
    $('#admin-header').load('../components/admin_header.html');

    // Get status from URL
    const urlParams = new URLSearchParams(window.location.search);
    const status = urlParams.get('status') || 'all';

    function fetchOrders() {
        $.ajax({
            url: 'placed_orders.php?action=fetch_orders&status=' + status,
            type: 'GET',
            dataType: 'json',
            success: function(orders) {
                let html = '';
                if (orders.length > 0) {
                    orders.forEach(function(order) {
                        html += `
                        <div class="box">
                            <p> user id : <span>${order.user_id}</span> </p>
                            <p> name : <span>${order.name}</span> </p>
                            <p> email : <span>${order.email}</span> </p>
                            <p> number : <span>${order.number}</span> </p>
                            <p> address : <span>${order.address}</span> </p>
                            <p> total items : <span>${order.total_items}</span> </p>
                            <p> total price : <span>$${order.total_price}/-</span> </p>
                            <p> payment method : <span>${order.method}</span> </p>
                            <form class="update-form">
                                <input type="hidden" name="order_id" value="${order.id}">
                                <select name="payment_status" class="drop-down">
                                    <option value="" selected disabled>${order.payment_status}</option>
                                    <option value="pending">pending</option>
                                    <option value="completed">completed</option>
                                </select>
                                <div class="flex-btn">
                                    <input type="submit" value="update" class="btn" name="update_payment">
                                    <a href="#" class="delete-btn" data-id="${order.id}">delete</a>
                                </div>
                            </form>
                        </div>`;
                    });
                } else {
                    html = '<p class="empty">no orders found!</p>';
                }
                $('#orders-container').html(html);
            },
            error: function(xhr, status, error) {
                console.error("Error fetching orders:", error);
                $('#orders-container').html('<p class="empty">Error fetching orders. Please try again.</p>');
            }
        });
    }

    fetchOrders();

    $(document).on('submit', '.update-form', function(e) {
        e.preventDefault();
        $.ajax({
            url: 'placed_orders.php',
            type: 'POST',
            data: $(this).serialize() + '&update_payment=1',
            dataType: 'json',
            success: function(response) {
                if (response.success) {
                    alert(response.success);
                    fetchOrders();
                } else {
                    alert('Error: ' + response.error);
                }
            },
            error: function(xhr, status, error) {
                console.error("Error updating payment status:", error);
                alert('Error updating payment status. Please try again.');
            }
        });
    });

    $(document).on('click', '.delete-btn', function(e) {
        e.preventDefault();
        if (confirm('Delete this order?')) {
            let orderId = $(this).data('id');
            $.ajax({
                url: 'placed_orders.php?delete=' + orderId,
                type: 'GET',
                dataType: 'json',
                success: function(response) {
                    if (response.success) {
                        alert(response.success);
                        fetchOrders();
                    } else {
                        alert('Error: ' + response.error);
                    }
                },
                error: function(xhr, status, error) {
                    console.error("Error deleting order:", error);
                    alert('Error deleting order. Please try again.');
                }
            });
        }
    });
});
</script>

<script src="../js/admin_script.js"></script>
</body>
</html>

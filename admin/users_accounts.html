<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>users accounts</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="../css/admin_style.css">

   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

<div id="admin-header"></div>

<!-- user accounts section starts  -->

<section class="accounts">

   <h1 class="heading">users account</h1>

   <div class="box-container" id="accounts-container">
      <!-- User accounts will be loaded here -->
   </div>

</section>

<!-- user accounts section ends -->

<!-- custom js file link  -->
<script src="../js/admin_script.js"></script>
<script>
$(document).ready(function() {
    // Load admin header
    $("#admin-header").load("../components/admin_header.html");

    // Function to load user accounts
    function loadAccounts() {
        $.ajax({
            url: 'fetch_users.php',
            type: 'GET',
            dataType: 'json',
            success: function(data) {
                var container = $('#accounts-container');
                container.empty();
                if(data.length > 0) {
                    $.each(data, function(i, account) {
                        container.append(`
                            <div class="box">
                                <p> user id : <span>${account.id}</span> </p>
                                <p> username : <span>${account.name}</span> </p>
                                <a href="#" class="delete-btn" data-id="${account.id}">delete</a>
                            </div>
                        `);
                    });
                } else {
                    container.append('<p class="empty">no accounts available</p>');
                }
            },
            error: function() {
                alert('Failed to load user accounts');
            }
        });
    }

    // Load accounts on page load
    loadAccounts();

    // Handle delete button click
    $(document).on('click', '.delete-btn', function(e) {
        e.preventDefault();
        if(confirm('delete this account?')) {
            var userId = $(this).data('id');
            $.ajax({
                url: 'fetch_users.php',
                type: 'GET',
                data: {delete: userId},
                dataType: 'json',
                success: function(response) {
                    if(response.success) {
                        loadAccounts();
                    } else {
                        alert('Failed to delete user');
                    }
                },
                error: function() {
                    alert('Failed to delete user');
                }
            });
        }
    });
});
</script>

</body>
</html>

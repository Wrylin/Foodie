<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Profile Update</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="../css/admin_style.css">

</head>
<body>

<div id="admin-header"></div>

<!-- admin profile update section starts  -->

<section class="form-container">
   <form id="update-form">
      <h3>Update Profile</h3>
      <input type="text" name="name" id="name" maxlength="20" class="box" oninput="this.value = this.value.replace(/\s/g, '')" placeholder="">
      <input type="password" name="old_pass" maxlength="20" placeholder="Enter your old password" class="box" oninput="this.value = this.value.replace(/\s/g, '')">
      <input type="password" name="new_pass" maxlength="20" placeholder="Enter your new password" class="box" oninput="this.value = this.value.replace(/\s/g, '')">
      <input type="password" name="confirm_pass" maxlength="20" placeholder="Confirm your new password" class="box" oninput="this.value = this.value.replace(/\s/g, '')">
      <input type="submit" value="Update Now" name="submit" class="btn">
   </form>
   <div id="message" style="margin-top: 20px; text-align: center;"></div>
</section>

<!-- admin profile update section ends -->

<!-- custom js file link  -->
<script src="../js/admin_script.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(document).ready(function() {
    // Load admin header
    $("#admin-header").load("../components/admin_header.html");

    // Fetch current profile data
    $.ajax({
        url: 'update_profile.php',
        type: 'GET',
        dataType: 'json',
        success: function(data) {
            if(data.error) {
                $('#message').html('<p style="color: red;">' + + '</p>');
                setTimeout(function() {
                    window.location.href = 'admin_login.html';
                }, 2000);
            } else {
                $('#name').attr('placeholder', data.name);
            }
        },
        error: function(xhr, status, error) {
            $('#message').html('<p style="color: red;">Error fetching profile data: ' + error + '</p>');
        }
    });

    // Handle form submission
    $('#update-form').submit(function(e) {
        e.preventDefault();
        $.ajax({
            url: 'update_profile.php',
            type: 'POST',
            data: $(this).serialize() + '&submit=1',
            dataType: 'json',
            success: function(response) {
                if(response.error) {
                  alert(response.error);
                    if(response.error === 'Not logged in') {
                        setTimeout(function() {
                            window.location.href = 'admin_login.html';
                        }, 2000);
                    }
                } else if(response.message) {
                     alert(response.message);
                    if(response.message.includes('updated successfully')) {
                        $('#update-form')[0].reset();
                    }
                }
            },
            error: function(xhr, status, error) {
                $('#message').html('<p style="color: red;">Error updating profile: ' + error + '</p>');
            }
        });
    });
});
</script>

</body>
</html>

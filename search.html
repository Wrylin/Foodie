<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>search page</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="css/style.css">

   <!-- jQuery -->
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
   
<!-- header section starts -->
<div id="header"></div>
<!-- header section ends -->

<!-- search form section starts  -->

<section class="search-form">
   <form id="searchForm">
      <input type="text" name="search_box" placeholder="search here..." class="box">
      <button type="submit" class="fas fa-search"></button>
   </form>
</section>

<!-- search form section ends -->


<section class="items" style="min-height: 100vh; padding-top:0;">
   <div class="box-container" id="itemContainer">
      <!-- Items will be dynamically inserted here -->
   </div>
</section>


<!-- footer section starts -->
<div id="footer"></div>
<!-- footer section ends -->


<!-- custom js file link  -->
<script src="js/script.js"></script>
<script>
   $(document).ready(function() {
      // Load header and footer
      $("#header").load("components/user_header.html");
      $("#footer").load("components/footer.html");
   
      // Handle form submission
      $("#searchForm").submit(function(e) {
         e.preventDefault();
         var searchTerm = $("input[name='search_box']").val().trim();
         
         if (!searchTerm) {
            $("#itemContainer").html('<p class="empty">Please enter a search term</p>');
            return;
         }
   
         $.ajax({
            url: 'search_items.php',
            type: 'POST',
            data: {search_box: searchTerm},
            dataType: 'json',
            beforeSend: function() {
               $("#itemContainer").html('<p class="empty">Searching...</p>');
            },
            success: function(response) {
               var itemContainer = $("#itemContainer");
               itemContainer.empty();
               
               if(response.status === 'success') {
                  if(response.data && response.data.length > 0) {
                     response.data.forEach(function(item) {
                        var itemHtml = `
                           <form action="" method="post" class="box" id="add-to-cart-form">
                              <input type="hidden" name="pid" value="${item.id || ''}">
                              <input type="hidden" name="name" value="${item.name || ''}">
                              <input type="hidden" name="price" value="${item.price || ''}">
                              <input type="hidden" name="image" value="${item.image || ''}">
                              <a href="quick_view.html?pid=${item.id || ''}" class="fas fa-eye"></a>
                              <button type="submit" class="fas fa-shopping-cart" name="add_to_cart"></button>
                              <img src="uploaded_img/${item.image || ''}" alt="">
                              <a href="category.html?category=${item.category || ''}" class="cat">
                                 ${item.category || ''}
                              </a>
                              <div class="name">${item.name || ''}</div>
                              <div class="flex">
                                 <div class="price"><span>$</span>${item.price || '0'}</div>
                                 <input type="number" name="qty" class="qty" min="1" max="99" value="1" maxlength="2">
                              </div>
                           </form>
                        `;
                        itemContainer.append(itemHtml);
                     });
                  } else {
                     itemContainer.html('<p class="empty">No items found</p>');
                  }
               } else {
                  itemContainer.html(`<p class="empty">Error: ${response.message}</p>`);
               }
            },
            error: function(jqXHR, textStatus, errorThrown) {
               console.error("AJAX Error:", textStatus, errorThrown);
               console.error("Response Text:", jqXHR.responseText);
               $("#itemContainer").html('<p class="empty">Error occurred while fetching items. Please try again.</p>');
            }
         });
      });
   
      // Handle add to cart
      $(document).on('submit', '#add-to-cart-form', function(e) {
         e.preventDefault();
         $.ajax({
            url: 'components/add_cart.php',
            method: 'POST',
            data: $(this).serialize() + '&add_to_cart=1',
            dataType: 'json',
            success: function(response) {
               if (response.success) {
                  alert('Item added to cart successfully!');
                  $("#header").load("components/user_header.html");
               } else {
                  alert('Error: ' + (response.error || 'Failed to add item to cart'));
               }
            },
            error: function(xhr, status, error) {
               console.error("AJAX Error:", status, error);
               alert('Error adding item to cart. Please try again.');
            }
         });
      });
   });
   </script>
   

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="header"></div>

    <section class="user-details">
        <div class="user">
            <img src="imgs/pic-4.png" alt="">
            <p><i class="fas fa-user"></i><span id="user-name"></span></p>
            <p><i class="fas fa-phone"></i><span id="user-number"></span></p>
            <p><i class="fas fa-envelope"></i><span id="user-email"></span></p>
            <a href="update_profile.html" class="btn">update info</a>
            <p class="address"><i class="fas fa-map-marker-alt"></i><span id="user-address"></span></p>
            <a href="update_address.html" class="btn">update address</a>
        </div>
    </section>

    <div id="footer"></div>

    <script src="js/script.js"></script>
    <script>
        // Load user profile data when page loads
        window.addEventListener('load', function() {
            fetchProfileData();
        });

        function fetchProfileData() {
            fetch('profile_process.php')
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        window.location.href = 'home.html';
                        return;
                    }
                    if (data.success) {
                        displayProfileData(data.profile);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    window.location.href = 'home.html';
                });
        }

        function displayProfileData(profile) {
            document.getElementById('user-name').textContent = profile.name;
            document.getElementById('user-number').textContent = profile.number;
            document.getElementById('user-email').textContent = profile.email;
            document.getElementById('user-address').textContent = 
                profile.address ? profile.address : 'please enter your address';
        }

        // Load header and footer
        document.addEventListener('DOMContentLoaded', function() {
            fetch('components/user_header.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('header').innerHTML = data;
                });

            fetch('components/footer.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('footer').innerHTML = data;
                });
        });
    </script>
</body>
</html>

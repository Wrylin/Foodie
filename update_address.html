<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Update Address</title>
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
   <link rel="stylesheet" href="css/style.css">
</head>
<body>
   
<div id="header"></div>

<section class="form-container">
   <form id="address-form">
      <h3>Your Address</h3>
      <input type="text" class="box" placeholder="Unit no." required maxlength="50" name="unit" id="unit">
      <input type="text" class="box" placeholder="Street" required maxlength="50" name="street" id="street">
      <input type="text" class="box" placeholder="Subdivision" required maxlength="50" name="subdiv" id="subdiv">
      <input type="text" class="box" placeholder="City" required maxlength="50" name="city" id="city">
      <input type="text" class="box" placeholder="Province" required maxlength="50" name="prov" id="prov">
      <input type="number" class="box" placeholder="Pin code" required max="999999" min="0" maxlength="6" name="pin_code" id="pin_code">
      <input type="submit" value="Save Address" class="btn">
   </form>
</section>

<div id="footer"></div>

<script src="js/script.js"></script>
<script>
    // Load header and footer
    document.addEventListener('DOMContentLoaded', function() {
        fetch('components/user_header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header').innerHTML = data;
            });

        fetch('components/footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer').innerHTML = data;
            });

        // Fetch current address
        fetch('update_address.php')
            .then(response => response.json())
            .then(data => {
                if(data.success && data.address) {
                    const addressParts = data.address.split(', ');
                    document.getElementById('unit').value = addressParts[0] || '';
                    document.getElementById('street').value = addressParts[1] || '';
                    document.getElementById('subdiv').value = addressParts[2] || '';
                    document.getElementById('city').value = addressParts[3] || '';
                    document.getElementById('prov').value = addressParts[4] || '';
                    document.getElementById('pin_code').value = addressParts[5] || '';
                }
            })
            .catch(error => {
                console.error('Error fetching address:', error);
            });
    });

    // Handle form submission
    document.getElementById('address-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            unit: document.getElementById('unit').value,
            street: document.getElementById('street').value,
            subdiv: document.getElementById('subdiv').value,
            city: document.getElementById('city').value,
            prov: document.getElementById('prov').value,
            pin_code: document.getElementById('pin_code').value
        };

        fetch('update_address.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.success) {
                alert(data.message);
                window.location.href = 'profile.html';
            } else {
                alert(data.error || 'An error occurred');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while updating your address');
        });
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>orders</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="css/style.css">

   <!-- jQuery -->
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
   
<div id="header"></div>

<div class="heading">
   <h3>orders</h3>
   <p><a href="home.html">home</a> <span> / orders</span></p>
</div>

<section class="orders">
   <h1 class="title">your orders</h1>
   <div class="box-container" id="orders-container">
      <!-- Orders will be loaded here -->
   </div>
</section>

<div id="footer"></div>

<script>
$(document).ready(function() {
    // Load header
    $("#header").load("components/user_header.html");
    
    // Load footer
    $("#footer").load("components/footer.html");
    
    // Function to format price
    function formatPrice(price) {
        return '$' + parseFloat(price).toFixed(2);
    }

    // Load orders
    function loadOrders() {
        $.ajax({
            url: 'orders_data.php',
            method: 'GET',
            dataType: 'json',
            success: function(response) {
                const container = $('#orders-container');
                container.empty();

                if (response.status === 'error' && response.error === 'not_logged_in') {
                    window.location.href = 'home.html';
                    return;
                }

                if (response.status === 'empty') {
                    container.html('<p class="empty">' + response.message + '</p>');
                    return;
                }

                if (response.status === 'success') {
                    response.orders.forEach(function(order) {
                        const orderBox = `
                            <div class="box">
                                <p>name : <span>${order.name}</span></p>
                                <p>email : <span>${order.email}</span></p>
                                <p>number : <span>${order.number}</span></p>
                                <p>address : <span>${order.address}</span></p>
                                <p>payment method : <span>${order.method}</span></p>
                                <p>your orders : <span>${order.total_items}</span></p>
                                <p>total price : <span>Php ${order.total_price}</span></p>
                                <p>payment status : <span>${order.payment_status}</span></p>
                            </div>
                        `;
                        container.append(orderBox);
                    });
                } else {
                    container.html('<p class="empty">Error loading orders. Please try again.</p>');
                }
            },
            error: function(xhr, status, error) {
                console.error('Error:', error);
                $('#orders-container').html('<p class="empty">Error loading orders. Please try again.</p>');
            }
        });
    }

    // Initial load of orders
    loadOrders();
});
</script>

</body>
</html>

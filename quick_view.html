<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quick view</title>

    <!-- font awesome cdn link  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

    <!-- custom css file link  -->
    <link rel="stylesheet" href="css/style.css">

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <div id="header"></div>

    <section class="quick-view">
        <h1 class="title">quick view</h1>
        <div id="item-container"></div>
    </section>

    <div id="footer"></div>

    <script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>

    <!-- custom js file link  -->
    <script src="js/script.js"></script>

    <script>
    $(document).ready(function() {
        // Load header and footer
        $("#header").load("components/user_header.html");
        $("#footer").load("components/footer.html");

        // Get the pid from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const pid = urlParams.get('pid');

        // Fetch item data
        $.ajax({
            url: 'get_item.php',
            method: 'GET',
            data: { pid: pid },
            dataType: 'json',
            success: function(data) {
                if (data.error) {
                    $('#item-container').html('<p class="empty">' + data.error + '</p>');
                } else {
                    let html = `
                        <form id="add-to-cart-form" class="box">
                            <input type="hidden" name="pid" value="${data.id}">
                            <input type="hidden" name="name" value="${data.name}">
                            <input type="hidden" name="price" value="${data.price}">
                            <input type="hidden" name="image" value="${data.image}">
                            <img src="uploaded_img/${data.image}" alt="${data.name}">
                            <a href="category.php?category=${data.category}" class="cat">${data.category}</a>
                            <div class="name">${data.name}</div>
                            <div class="flex">
                                <div class="price"><span>Php </span>${data.price}</div>
                                <input type="number" name="qty" class="qty" min="1" max="99" value="1" maxlength="2">
                            </div>
                            <button type="submit" name="add_to_cart" class="cart-btn">add to cart</button>
                        </form>
                    `;
                    $('#item-container').html(html);
                }
            },
            error: function(xhr, status, error) {
                $('#item-container').html('<p class="empty">Error loading item. Please try again later.</p>');
                console.error("AJAX Error: " + status + " - " + error);
            }
        });

        // Handle form submission
        $(document).on('submit', '#add-to-cart-form', function(e) {
            e.preventDefault();
            $.ajax({
                url: 'components/add_cart.php', // Updated path
                method: 'POST',
                data: $(this).serialize() + '&add_to_cart=1',
                dataType: 'json',
                success: function(response) {
                    if (response.success) {
                        alert('Item added to cart successfully!');
                    } else {
                        alert('Error: ' + (response.error || 'Failed to add item to cart'));
                    }
                },
                error: function(xhr, status, error) {
                    alert('Error adding item to cart. Please try again.');
                    console.error("AJAX Error: " + status + " - " + error);
                }
            });
        });
    });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>menu</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">

   <!-- custom css file link  -->
   <link rel="stylesheet" href="css/style.css">

   <!-- jQuery -->
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

   <!-- header section starts -->
   <div id="user-header"></div>
   <!-- header section ends -->

   <div class="heading">
      <h3>our menu</h3>
      <p><a href="home.html">home</a> <span> / menu</span></p>
   </div>

   <!-- menu section starts  -->

   <section class="items">

      <h1 class="title">latest dishes</h1>

      <div class="box-container" id="menu-items">
         <!-- Items will be dynamically inserted here -->
      </div>

   </section>
   <!-- menu section ends -->


   <!-- footer section starts -->
   <div id="footer"></div>
   <!-- footer section ends -->


   <!-- custom js file link  -->
   <script src="js/script.js"></script>

   <script>
   $(document).ready(function() {
      // Load header and footer
      $("#user-header").load("components/user_header.html");
      $("#footer").load("components/footer.html");

      function showMessage(message, isError = false) {
        const messageHtml = `
            <div class="message ${isError ? 'error' : 'success'}">
                <span>${message}</span>
                <i class="fas fa-times" onclick="this.parentElement.remove();"></i>
            </div>
        `;
        $('#message-container').html(messageHtml);
        
        setTimeout(() => {
            $('#message-container .message').fadeOut();
        }, 5000);
    }

      // Fetch menu items
      $.ajax({
         url: 'menu.php',
         type: 'GET',
         dataType: 'json',
         success: function(data) {
            let html = '';
            if (data.length > 0) {
               data.forEach(function(item) {
                  html += `
                     <form action="" method="post" class="box">
                        <input type="hidden" name="pid" value="${item.id}">
                        <input type="hidden" name="name" value="${item.name}">
                        <input type="hidden" name="price" value="${item.price}">
                        <input type="hidden" name="image" value="${item.image}">
                        <a href="quick_view.html?pid=${item.id}" class="fas fa-eye"></a>
                        <button type="submit" class="fas fa-shopping-cart" name="add_to_cart"></button>
                        <img src="uploaded_img/${item.image}" alt="">
                        <a href="category.html?category=${item.category}" class="cat">${item.category}</a>
                        <div class="name">${item.name}</div>
                        <div class="flex">
                           <div class="price"><span>Php </span>${item.price}</div>
                           <input type="number" name="qty" class="qty" min="1" max="99" value="1" maxlength="2">
                        </div>
                     </form>
                  `;
               });
            } else {
               html = '<p class="empty">no items added yet!</p>';
            }
            $('#menu-items').html(html);
         },
         error: function(xhr, status, error) {
            console.error("AJAX Error:", {xhr, status, error});
            $('#menu-items').html('<p class="empty">Error loading menu items. Please try again later.</p>');
            showMessage('Failed to load menu items: ' + error, true);
         }
      });

      // Handle add to cart
      $(document).on('submit', '.box', function(e) {
         e.preventDefault();
         var formData = $(this).serialize();
         $.ajax({
            url: 'components/add_cart.php',
            type: 'POST',
            data: formData,
            dataType: 'json',
            success: function(response) {
               if(response.success) {
                  alert('Item added to cart successfully!');
                  $("#user-header").load("components/user_header.html");
               } else {
                  alert('Error: ' + (response.error || 'Failed to add item to cart'));
               }
            },
            error: function(xhr, status, error) {
               console.error("Error adding to cart:", error);
               alert('Error adding item to cart. Please try again.');
            }
         });
      });
   });
   </script>

</body>

</html>
